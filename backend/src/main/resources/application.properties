spring.application.name=what-to-watch

spring.datasource.url=jdbc:mysql://localhost:3306/what_to_watch
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.frontend.base-url=http://localhost:4200

app.tmdb.base-url=https://api.themoviedb.org/3
app.tmdb.read-access-token=${TMDB_READ_ACCESS_TOKEN}

logging.level.root=INFO
logging.level.com.whattowatch=DEBUG
logging.level.org.springframework.security=INFO